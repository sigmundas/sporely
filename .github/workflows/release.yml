name: build-release

# Builds every installer into a DRAFT release; publishing is a manual step.
# Prefer workflow_dispatch: a draft created for a tag that does not exist yet
# creates the tag only when it is published. A pushed tag appears in
# releases.atom at once, and the desktop update check reads that feed.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.9.29 (created when the draft is published)"
        required: true

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  GH_REPO: ${{ github.repository }}

jobs:
  validate-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release tag and application version
        id: version
        shell: bash
        run: |
          version=$(python tools/release_version.py check-release \
            --tag "$RELEASE_TAG" \
            --app-file main.py)
          echo "version=$version" >> "$GITHUB_OUTPUT"

  create-draft:
    needs: validate-version
    runs-on: ubuntu-latest
    steps:
      - name: Create the draft release (or reuse an existing draft)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft -q .isDraft > is_draft.txt 2>/dev/null; then
            if [ "$(cat is_draft.txt)" != "true" ]; then
              echo "::error::$RELEASE_TAG is already published; refusing to upload into it"
              exit 1
            fi
            echo "Reusing draft $RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" --draft --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" --generate-notes
          fi

  build-windows:
    needs: [validate-version, create-draft]
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Generate app icon
        shell: pwsh
        run: |
          python -m pip install pillow --quiet --disable-pip-version-check
          python tools/make_ico.py

      - name: Build with PyInstaller
        shell: pwsh
        run: ./build.ps1

      - name: Build installer
        id: installer
        shell: pwsh
        run: |
          $version = "${{ needs.validate-version.outputs.version }}"
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc /DMyAppVersion=$version installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          echo "name=Sporely-$version-windows-setup.exe" >> $env:GITHUB_OUTPUT

      - name: Upload installer to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release upload "$env:RELEASE_TAG" "${{ steps.installer.outputs.name }}" --clobber

  build-linux:
    needs: [validate-version, create-draft]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Generate icons
        run: |
          pip install pillow --quiet --disable-pip-version-check
          python tools/make_ico.py

      - name: Build with PyInstaller
        run: |
          chmod +x ./build_linux.sh
          ./build_linux.sh

      - name: Build .deb
        id: deb
        run: |
          version="${{ needs.validate-version.outputs.version }}"
          pkg="sporely_${version}_amd64"

          mkdir -p "$pkg/DEBIAN"
          mkdir -p "$pkg/opt/sporely"
          mkdir -p "$pkg/usr/bin"
          mkdir -p "$pkg/usr/share/applications"
          mkdir -p "$pkg/usr/share/icons/hicolor/256x256/apps"

          cp -r dist/Sporely/. "$pkg/opt/sporely/"
          ln -s /opt/sporely/Sporely "$pkg/usr/bin/sporely"
          cp assets/icons/sporely_256.png "$pkg/usr/share/icons/hicolor/256x256/apps/sporely.png"

          cat > "$pkg/usr/share/applications/sporely.desktop" << 'EOF'
          [Desktop Entry]
          Name=Sporely
          Comment=Field observations, microscopy calibration, and spore measurements
          Exec=/opt/sporely/Sporely
          Icon=sporely
          Terminal=false
          Type=Application
          Categories=Science;Education;
          EOF

          cat > "$pkg/DEBIAN/control" << EOF
          Package: sporely
          Version: $version
          Architecture: amd64
          Maintainer: Sigmund Astrup <sigmundas@users.noreply.github.com>
          Description: Sporely - field observations and spore measurements
           A desktop application for field observations,
           microscopy calibration, and spore measurements.
          EOF

          dpkg-deb --build "$pkg"
          echo "name=${pkg}.deb" >> $GITHUB_OUTPUT

      - name: Upload package to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" "${{ steps.deb.outputs.name }}" --clobber

  build-macos:
    needs: [validate-version, create-draft]
    # Use a matrix to build for both Intel (x86_64) and Apple Silicon (arm64)
    strategy:
      matrix:
        include:
          - arch: intel
            runner: macos-15-intel      # Standard Intel runner
          - arch: apple-silicon
            runner: macos-latest  # Now defaults to M1/arm64 on GitHub
    
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Generate icons
        run: |
          pip install pillow --quiet --disable-pip-version-check
          # Icon generation is architecture-independent
          python tools/make_ico.py
          ICONSET=assets/icons/Sporely.iconset
          mkdir -p "$ICONSET"
          python3 - << 'PYEOF'
          from PIL import Image
          from pathlib import Path
          src = Path("assets/icons/sporely icon.png")
          iconset = Path("assets/icons/Sporely.iconset")
          img = Image.open(src).convert("RGBA")
          w, h = img.size; side = min(w, h)
          img = img.crop(((w-side)//2, (h-side)//2, (w+side)//2, (h+side)//2))
          for size, name in [
              (16,  "icon_16x16.png"), (32,  "icon_16x16@2x.png"),
              (32,  "icon_32x32.png"), (64,  "icon_32x32@2x.png"),
              (128, "icon_128x128.png"), (256, "icon_128x128@2x.png"),
              (256, "icon_256x256.png"), (512, "icon_256x256@2x.png"),
              (512, "icon_512x512.png"),
          ]:
              img.resize((size, size), Image.LANCZOS).save(str(iconset / name))
          PYEOF
          iconutil -c icns "$ICONSET" -o assets/icons/sporely.icns
          rm -rf "$ICONSET"

      - name: Build with PyInstaller
        env:
          SPORELY_BUILD_VERSION: ${{ needs.validate-version.outputs.version }}
        run: |
          chmod +x ./build_mac.sh
          # PyInstaller automatically detects the runner's architecture
          ./build_mac.sh

      - name: Verify macOS bundle version
        run: |
          python tools/release_version.py check-macos-bundle \
            --plist dist/Sporely.app/Contents/Info.plist \
            --expected "${{ needs.validate-version.outputs.version }}"

      - name: Package .dmg
        id: dmg
        run: |
          sleep 10
          tag="$RELEASE_TAG"
          # Include architecture in the filename for clarity
          dmg_name="Sporely-${tag}-macos-${{ matrix.arch }}.dmg"
          staging="dmg_staging"
          mkdir -p "$staging"
          cp -R dist/Sporely.app "$staging/"
          ln -s /Applications "$staging/Applications"
          hdiutil create \
            -volname "Sporely" \
            -srcfolder "$staging" \
            -ov -format UDZO \
            "$dmg_name"
          echo "name=$dmg_name" >> $GITHUB_OUTPUT

      - name: Upload disk image to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" "${{ steps.dmg.outputs.name }}" --clobber

  verify-draft:
    needs: [validate-version, build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: The release is still a draft with all four installers
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate-version.outputs.version }}
        run: |
          gh release view "$RELEASE_TAG" --json isDraft,assets > release.json
          jq -e '.isDraft == true' release.json
          for name in "Sporely-$VERSION-windows-setup.exe" "sporely_${VERSION}_amd64.deb" \
                      "Sporely-$RELEASE_TAG-macos-intel.dmg" "Sporely-$RELEASE_TAG-macos-apple-silicon.dmg"; do
            jq -e --arg n "$name" 'any(.assets[]; .name == $n and .size > 0)' release.json >/dev/null \
              || { echo "::error::missing asset $name"; exit 1; }
          done
          jq -r '.assets[] | "\(.name) \(.size)"' release.json
