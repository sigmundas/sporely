name: CI

# Fast checks for every pull request and for main. No secrets, no Supabase
# access: the suite isolates app data and the keychain itself
# (tests/conftest.py), and the local-Supabase tests skip without their env.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4

      # The release builds use 3.12; test the runtime users get.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Qt's offscreen platform still loads EGL/GL, xkbcommon and fontconfig.
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 fonts-dejavu-core

      - name: Install dependencies
        run: |
          grep -v -i '^pyinstaller' requirements.txt > "$RUNNER_TEMP/requirements-test.txt"
          python -m pip install -r "$RUNNER_TEMP/requirements-test.txt" pytest==9.1.1 pytest-qt==4.5.0

      # tests/test_render_review_screenshots.py renders every review scenario
      # and is too slow for a per-PR check.
      - name: Run tests
        run: >-
          python -m pytest -q -rfE --tb=short -p no:cacheprovider tests database
          --ignore=tests/test_render_review_screenshots.py
