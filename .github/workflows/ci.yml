name: CI

# Fast checks for every pull request and for main. No secrets, no Supabase
# access: the suite isolates app data and the keychain itself
# (tests/conftest.py), and the local-Supabase tests skip without their env.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4

      # The release builds use 3.12; test the runtime users get.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Qt's offscreen platform still loads EGL/GL, xkbcommon and fontconfig.
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 fonts-dejavu-core

      - name: Install dependencies
        run: |
          grep -v -i '^pyinstaller' requirements.txt > "$RUNNER_TEMP/requirements-test.txt"
          python -m pip install -r "$RUNNER_TEMP/requirements-test.txt" pytest==9.1.1 pytest-qt==4.5.0

      # tests/test_render_review_screenshots.py renders every review scenario
      # and is too slow for a per-PR check. The deselected tests fail on main
      # as well (2026-10-27) and are tracked separately; remove each line once
      # its test is fixed.
      - name: Run tests
        run: >-
          python -m pytest -q -rfE --tb=short -p no:cacheprovider tests database
          --ignore=tests/test_render_review_screenshots.py
          --deselect tests/test_live_lab_raw_controls.py::test_live_lab_review_keyboard_shortcuts_navigate_save_and_skip_text_focus
          --deselect tests/test_reference_add_dialog_normalized.py::test_parsed_q_range_is_refused_rather_than_silently_dropped
          --deselect tests/test_reference_add_dialog_normalized.py::test_q_typical_cells_entered_beside_q_extremes_are_refused
          --deselect tests/test_reference_manual_entry_layout.py::test_the_footer_will_not_offer_to_add_an_entry_that_cannot_be_stored
          --deselect tests/test_reference_manual_entry_layout.py::test_the_preview_and_the_refusal_describe_the_same_entry
          --deselect tests/test_reference_manual_entry_layout.py::test_a_q_typical_range_blocks_because_v1_has_no_q_core_columns
          --deselect tests/test_reference_manual_entry_layout.py::test_q_extremes_plus_a_q_typical_range_block_on_real_numeric_loss
