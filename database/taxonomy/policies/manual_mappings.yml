      "rationale": "Agreeing-accepted-name bridge. Both sources publish the accepted name 'Entoloma conferendum (Britzelm.) Noordel.', but agreement on an accepted name is not identity evidence under mapping_policy.continuity_rules.canonical_name_only. The evidence offered for review is instead each source's own published synonymy: NorTaxa places 7 synonym names under taxonID 53482, and COL places all 7 of those same names, with byte-identical authorship, under usage 39ZCL. Both sources therefore independently assert that 'Nolanea conferenda (Britzelm.) Sacc.', 'Rhodophyllus staurosporus (Bres.) J.E. Lange', 'Entoloma rickenii (Romagn.) Courtec.', 'Entoloma staurosporum (Bres.) E. Horak', 'Nolanea staurospora Bres.', 'Rhodophyllus rickenii Romagn.' and 'Rhodophyllus staurosporus var. platyphyllus Romagn. & J. Favre' belong to their accepted concept. The two concepts are linked through those third published names, not through the spelling of the accepted name. The registry already binds this usage to sporely_taxon_id 7821, so approving this record changes no allocation; it supplies the reviewed relationship that lets the identifier be published as authoritative identity.",
