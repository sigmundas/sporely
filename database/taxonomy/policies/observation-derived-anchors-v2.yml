# W2E-A2 curated input for compile_release.py: observation-derived
# NorTaxa anchors for historical observations whose concepts fall
# outside the macrofungi scope.
#
# EVERY row in this file must be evidenced by an entry in the pinned
# NorTaxa 1.284 archive (database/taxonomy/sources/nortaxa/1.284/archive.zip).
# The allocator script re-reads the archive and refuses to allocate any ID
# that does not appear there with taxonomicStatus in ('valid','synonym').
#
# Additions here MUST NOT broaden the macrofungi search cache. Each anchor
# lands in the sparse persistent registry with cache_state=out_of_cache
# and scope_state=not_evaluated when consumed by the reconciliation engine.
#
# Provenance:
#   - discovered via W2D-R diagnostic 2026-08-01:
#     /Users/sigmundas/Documents/Code/sporely/w2dr/out/diagnostic/mapping-diagnostic.csv
#   - buckets: sqlite_present_no_registry_anchor (19), source_archive_only_no_registry_anchor (2)

release_id: "tax-2026.08.02-02"
first_seen_source_release: "nortaxa:1.284"
source_system: "nortaxa"
namespace: "nortaxa_taxon_id"

