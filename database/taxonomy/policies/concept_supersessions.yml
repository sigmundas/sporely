      "reviewer": "Sigmund Ås",
      "rationale": "Divergent-accepted-name bridge, and a merge. The two sources disagree about which name is correct for one species: NorTaxa accepts 'Pholiotina rugosa (Peck) Singer' (taxonID 52369) while COL accepts 'Conocybe rugosa (Peck) Watling' (usage 5ZT3G). The evidence is reciprocal published synonymy: COL lists 'Pholiotina rugosa (Peck) Singer' as a synonym of 5ZT3G (usage 4GMG5), and NorTaxa lists 'Conocybe rugosa (Peck) Watling' as a synonym of 52369 (taxonID 58722). Authorship is byte-identical on both names in both directions, so each source has explicitly published that the other's accepted name belongs to its own concept. This is the only reciprocal case in the entire 19,809-association population. A supersession rather than a mapping is required because release tax-2026.07.29-01 already allocated sporely_taxon_id 624680 to 52369: the registry is append-only, so the merge must select a current concept instead of rewriting that allocation, per mapping_policy.continuity_rules.merge. Approving this retains 624680's allocation history, publishes no second concept for the species, re-keys 52369's usage and its Norwegian name 'slank ringkjeglesopp' onto 83668, and leaves COL's accepted name preferred there. Verified structurally safe: no concept parents on 624680 and it has no children.",
