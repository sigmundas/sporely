        "shared basionym cited by the reviewer: COL publishes 'Pholiota rugosa Peck' (usage 6VBQK) as a synonym of 5ZT3G, and it is the basionym of both accepted names — NorTaxa's 'Pholiotina rugosa (Peck) Singer' and COL's 'Conocybe rugosa (Peck) Watling' both carry '(Peck)' as the parenthetical basionym author. The two accepted names are therefore recombinations of one original species, which is independent of the reciprocal-synonymy evidence above."
