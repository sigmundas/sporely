  "purpose": "Reviewed selection of a current Sporely concept for a concept that already holds its own allocated identity. This is the artifact continuity_rules.merge calls for ('retain_all_historical_usages_select_or_allocate_current_concept'): the identity registry is append-only, so a merge can never be expressed by rewriting an allocation. The registry keeps recording what was allocated; this ledger records which concept is current. Both are true, and the projection applies both, so one identifier still has exactly one answer.",
