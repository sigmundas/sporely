      "review_note": "Approved 2026-09-23 by Sigmund Ås, recorded against manual-verification check 'review-nortaxa-52369-supersession' (gate f0c45157058d4fedab2c13719c6cf548). Reviewer's decision as given: 'I approve superseding Sporely concept 624680 by 83668 for NorTaxa 52369 / COL 5ZT3G. The evidence supports these as the same taxonomic concept, including reciprocal synonymy and the shared basionym Pholiota rugosa Peck. Historical allocation and source provenance for 624680 must be retained.' That retention condition is what this mechanism implements: the append-only registry keeps 624680's allocation verbatim, and the superseded concept's usages are re-keyed onto 83668 carrying their own name, authorship, status and identifier, with superseded_from_sporely_taxon_id naming the concept they came from."
