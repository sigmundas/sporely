    "usages_are_retained": "Every source usage bound to the superseded concept is re-keyed onto the current concept as an alias, carrying its own scientific name, authorship, taxonomic status and external identifier. The superseding source's accepted-name treatment is therefore preserved and searchable rather than flattened.",
    "vernaculars_follow_identity": "Vernacular rows on the superseded concept are re-keyed onto the current concept, so national common names survive the supersession.",
    "presentation_is_unchanged": "The current concept keeps its own canonical name, rank and parent. A supersession never promotes the superseded source's preferred name.",
    "chains_are_refused": "A current concept that is itself superseded fails the compile. Resolving transitive supersession needs its own review and is not inferred."
